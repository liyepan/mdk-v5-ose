name: 打包

# 目标平台只有 Windows：这里出 win-x64 自包含包（用户不用另装 .NET 运行时）。
# Gitea 也会读 .github/workflows，每个 job 都带
#   if: github.server_url == 'https://github.com'
# 守卫，在 Gitea 上只显示 skipped，不占 runner。
# 工作流只读写 GitHub：不往 Gitea 推分支 / tag / Release。
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: "uVision5-OSE"
  DOTNET_VERSION: "10.0.x"

jobs:
  windows-x86_64:
    name: Windows x86_64
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 读版本号（csproj 里的 <Version>）
        shell: bash
        run: |
          set -euo pipefail
          version=$(dotnet msbuild src/UvisionOse.csproj -getProperty:Version -nologo | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "csproj 里读不到 <Version>" >&2
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "版本: $version"

      - name: 发布 win-x64 自包含包
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/UvisionOse.csproj \
            -c Release -r win-x64 --self-contained true \
            -p:PublishReadyToRun=true -p:DebugType=none \
            -o deploy
          ls -la deploy | head -25

      - name: 打 NSIS 安装包（关联 .uvprojx）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          makensis='/c/Program Files (x86)/NSIS/makensis.exe'
          if [ ! -x "$makensis" ]; then
            makensis=$(find '/c/Program Files (x86)' '/c/Program Files' -maxdepth 3 -iname 'makensis.exe' 2>/dev/null | head -n1)
          fi
          if [ -z "$makensis" ]; then
            choco install nsis -y --no-progress
            makensis=$(find '/c/Program Files (x86)' '/c/Program Files' -maxdepth 3 -iname 'makensis.exe' 2>/dev/null | head -n1)
          fi
          if [ -z "$makensis" ]; then
            echo "找不到 makensis（NSIS）" >&2
            exit 1
          fi

          output=$(cygpath -w "$PWD/dist/uVision5-OSE-$APP_VERSION-win64-setup.exe")
          deploy=$(cygpath -w "$PWD/deploy")
          script=$(cygpath -w "$PWD/packaging/windows/installer.nsi")

          icon_arg=""
          if [ -f "$PWD/packaging/windows/app.ico" ]; then
            icon_arg="/DICON_FILE=$(cygpath -w "$PWD/packaging/windows/app.ico")"
          fi

          # Git Bash（MSYS）会把 /D... 当成 Unix 路径转换，关掉参数转换
          MSYS2_ARG_CONV_EXCL='*' "$makensis" \
            "/DAPP_VERSION=$APP_VERSION" \
            "/DDEPLOY_DIR=$deploy" \
            "/DOUTPUT_FILE=$output" \
            $icon_arg \
            "$script"

          ls -lh dist

      - name: 便携版 zip
        shell: pwsh
        run: |
          Compress-Archive -Path deploy/* -DestinationPath "dist/uVision5-OSE-${{ env.APP_VERSION }}-win64-portable.zip"
          Get-ChildItem dist | Select-Object Name, Length

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*
          if-no-files-found: error

  release:
    name: 发布到 Release
    needs: [windows-x86_64]
    if: >-
      always() && !cancelled() &&
      github.server_url == 'https://github.com' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: meta
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' src/UvisionOse.csproj | head -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # 只动 GitHub 自己：把这次 Release 要用的 tag 在本仓库里补齐。
      # Gitea 那边一根手指都不碰。
      - name: 确保 tag 存在于 GitHub
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "GitHub 上已经有 $TAG"
            exit 0
          fi
          echo "GitHub 上没有 $TAG，本地补一个再推（只推 GitHub）"
          git tag "$TAG" "$GITHUB_SHA" 2>/dev/null || true
          git push origin "refs/tags/$TAG"

      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 检查产物
        run: |
          ls -lh dist
          count=$(find dist -maxdepth 1 -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "一个安装包都没有，不发布" >&2
            exit 1
          fi

      - name: 生成 SHA256SUMS
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort > /tmp/files.txt
          xargs sha256sum < /tmp/files.txt > SHA256SUMS
          cat SHA256SUMS

      - name: 挂到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: uVision5-OSE ${{ steps.meta.outputs.version }}
          files: dist/*
          draft: false
          prerelease: false
          make_latest: "true"
          generate_release_notes: true
          fail_on_unmatched_files: true
