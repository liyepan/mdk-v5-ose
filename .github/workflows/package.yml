name: 安装包

# 本项目目标平台只有 Windows，所以这里只出 Windows 安装包：
#   x86_64  NSIS 安装包 + 便携 zip
#   arm64   NSIS 安装包（默认关闭，见 windows-arm64 的说明）
#
# Gitea 也会读 .github/workflows，所以每个 job 都有
#   if: github.server_url == 'https://github.com'
# 守卫，在 Gitea 上只会显示 skipped，不占 runner。
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_VERSION: "5.15.2"
  APP_NAME: "uVision5-OSE"

jobs:
  windows-x86_64:
    name: Windows x86_64
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 安装 Qt 5.15.2
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2019_64
          cache: true

      - name: 编译并收集 Qt 依赖
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^VERSION[[:space:]]*=[[:space:]]*//p' mdk-v5-ose.pro | head -n1 | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "mdk-v5-ose.pro 里没有 VERSION" >&2
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

          mkdir -p build
          cd build
          # Git Bash 的 /usr/bin 里也有个 link.exe（coreutils 的硬链接工具），
          # 必须把 MSVC 的 bin 放到 PATH 最前面，nmake 才会用真正的 link.exe
          cl_path=$(command -v cl.exe || command -v cl || true)
          if [ -z "$cl_path" ]; then
            echo "PATH 里找不到 cl.exe" >&2
            exit 1
          fi
          msvc_bin=$(dirname "$cl_path")
          export PATH="$msvc_bin:$PATH"
          echo "cl: $(command -v cl)"
          echo "link: $(command -v link)"

          qmake ../mdk-v5-ose.pro CONFIG+=release
          nmake release || nmake
          if [ -f release/mdk-v5-ose.exe ]; then
            exe=release/mdk-v5-ose.exe
          else
            exe=$(find . -name mdk-v5-ose.exe | head -n1)
          fi
          if [ -z "$exe" ]; then
            echo "没找到 mdk-v5-ose.exe" >&2
            exit 1
          fi
          mkdir -p ../deploy
          cp "$exe" ../deploy/mdk-v5-ose.exe
          cd ..

          windeployqt --release --no-translations --compiler-runtime deploy/mdk-v5-ose.exe
          find deploy -maxdepth 1 -type f | sort

      - name: 打 NSIS 安装包（关联 .uvprojx）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          makensis='/c/Program Files (x86)/NSIS/makensis.exe'
          if [ ! -x "$makensis" ]; then
            makensis=$(find '/c/Program Files (x86)' '/c/Program Files' -maxdepth 3 -iname 'makensis.exe' 2>/dev/null | head -n1)
          fi
          if [ -z "$makensis" ]; then
            choco install nsis -y --no-progress
            makensis=$(find '/c/Program Files (x86)' '/c/Program Files' -maxdepth 3 -iname 'makensis.exe' 2>/dev/null | head -n1)
          fi
          if [ -z "$makensis" ]; then
            echo "找不到 makensis（NSIS）" >&2
            exit 1
          fi

          output=$(cygpath -w "$PWD/dist/${{ env.APP_NAME }}-$APP_VERSION-win64-setup.exe")
          deploy=$(cygpath -w "$PWD/deploy")
          script=$(cygpath -w "$PWD/packaging/windows/installer.nsi")

          # 有图标就带上；没有也不影响（安装包会用 exe 自带的默认图标）
          icon_arg=""
          if [ -f "$PWD/packaging/windows/app.ico" ]; then
            icon_arg="/DICON_FILE=$(cygpath -w "$PWD/packaging/windows/app.ico")"
          fi

          # Git Bash（MSYS）会把 /D... 当成 Unix 路径转换，这里关掉参数转换
          MSYS2_ARG_CONV_EXCL='*' "$makensis" \
            "/DAPP_VERSION=$APP_VERSION" \
            "/DDEPLOY_DIR=$deploy" \
            "/DOUTPUT_FILE=$output" \
            $icon_arg \
            "$script"

          ls -lh dist

      - name: 便携版 zip
        shell: pwsh
        run: |
          Compress-Archive -Path deploy/* -DestinationPath "dist/${env:APP_NAME}-${env:APP_VERSION}-win64-portable.zip"
          Get-ChildItem dist | Select-Object Name, Length

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows on ARM64
  #
  # 官方 Qt 5.15.2 **没有** win64 arm64 的二进制包（Qt for Windows on ARM
  # 从 Qt 6.2 才有）。所以这个 job 默认关闭，只有在仓库 Variables 里设置
  #   ENABLE_WIN_ARM64 = true
  # 之后才会跑；并且要求你自己提供一个 arm64 版 Qt5，路径放在
  #   WIN_ARM64_QT_DIR = D:/Qt/5.15.2/msvc2019_arm64
  #
  # 没有 arm64 Qt 时的建议：直接发 x64 包。Windows 11 on ARM 可以模拟运行
  # x64 程序，功能一致，只是没有原生优化。
  # ---------------------------------------------------------------------------
  windows-arm64:
    name: Windows arm64
    if: >-
      ${{ github.server_url == 'https://github.com' &&
              vars.ENABLE_WIN_ARM64 == 'true' }}
    continue-on-error: true
    runs-on: windows-11-arm
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 MSVC 环境（arm64）
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: 检查 arm64 版 Qt
        shell: bash
        run: |
          set -euo pipefail
          qt_dir="${WIN_ARM64_QT_DIR:-}"
          if [ -z "$qt_dir" ] || [ ! -x "$qt_dir/bin/qmake.exe" ]; then
            echo "::error::没有可用的 arm64 版 Qt5，请设置仓库 Variable WIN_ARM64_QT_DIR"
            echo "官方 Qt 5.15.2 不提供 win64 arm64 包，需要自己构建或改用 Qt6。"
            exit 1
          fi
          echo "使用 Qt: $qt_dir"
          echo "$qt_dir/bin" >> "$GITHUB_PATH"

      - name: 编译并收集 Qt 依赖
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^VERSION[[:space:]]*=[[:space:]]*//p' mdk-v5-ose.pro | head -n1 | tr -d '[:space:]')
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

          mkdir -p build
          cd build
          qmake ../mdk-v5-ose.pro CONFIG+=release
          nmake release || nmake
          exe=$(find . -name mdk-v5-ose.exe | head -n1)
          if [ -z "$exe" ]; then
            echo "没找到 mdk-v5-ose.exe" >&2
            exit 1
          fi
          file "$exe"
          mkdir -p ../deploy
          cp "$exe" ../deploy/mdk-v5-ose.exe
          cd ..

          windeployqt --release --no-translations --compiler-runtime deploy/mdk-v5-ose.exe

      - name: 打 NSIS 安装包
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          makensis=$(find '/c/Program Files (x86)' '/c/Program Files' -maxdepth 3 -iname 'makensis.exe' 2>/dev/null | head -n1)
          if [ -z "$makensis" ]; then
            choco install nsis -y --no-progress
            makensis=$(find '/c/Program Files (x86)' '/c/Program Files' -maxdepth 3 -iname 'makensis.exe' 2>/dev/null | head -n1)
          fi

          output=$(cygpath -w "$PWD/dist/${{ env.APP_NAME }}-$APP_VERSION-arm64-setup.exe")
          deploy=$(cygpath -w "$PWD/deploy")
          script=$(cygpath -w "$PWD/packaging/windows/installer.nsi")

          MSYS2_ARG_CONV_EXCL='*' "$makensis" \
            "/DAPP_VERSION=$APP_VERSION" \
            "/DARCH_SUFFIX=arm64" \
            "/DDEPLOY_DIR=$deploy" \
            "/DOUTPUT_FILE=$output" \
            "$script"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: dist/*

  release:
    name: 发布到 Release
    needs: [windows-x86_64, windows-arm64]
    if: >-
      always() && !cancelled() &&
      github.server_url == 'https://github.com' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: meta
        run: |
          version=$(sed -n 's/^VERSION[[:space:]]*=[[:space:]]*//p' mdk-v5-ose.pro | head -n1 | tr -d '[:space:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Gitea 的 push mirror 是 --mirror 强推，会删掉 GitHub 上多出来的 tag，
      # tag 没了 Release 也会跟着消失。配了 GITEA_TOKEN 就把 tag 补回 Gitea。
      - name: 把 tag 同步回 Gitea（可选）
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
        run: |
          if [ -z "$GITEA_TOKEN" ]; then
            echo "没有配置 GITEA_TOKEN，跳过；tag 需要手动推到 Gitea"
            exit 0
          fi
          url="https://oauth2:$GITEA_TOKEN@git.linuxacme.com/liyepan/mdk-v5-ose.git"
          if git ls-remote --exit-code --tags "$url" "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Gitea 已有 $TAG，不用推"
            exit 0
          fi
          git tag "$TAG" "$GITHUB_SHA" 2>/dev/null || true
          if ! git push "$url" "refs/tags/$TAG"; then
            echo "::warning::推 tag $TAG 到 Gitea 失败，下次镜像同步可能把这个 Release 删掉"
          fi

      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 检查产物
        run: |
          ls -lh dist
          count=$(find dist -maxdepth 1 -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "一个安装包都没有，不发布" >&2
            exit 1
          fi

      - name: 生成 SHA256SUMS
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort > /tmp/files.txt
          xargs sha256sum < /tmp/files.txt > SHA256SUMS
          cat SHA256SUMS

      - name: 挂到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: uVision5-OSE ${{ steps.meta.outputs.version }}
          files: dist/*
          draft: false
          prerelease: false
          make_latest: "true"
          generate_release_notes: true
          fail_on_unmatched_files: true
